[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copromem"
version = "0.2.0"
description = "Dataset-independent procedural memory from attested trajectories"
requires-python = ">=3.10"
dependencies = []

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/tuananhlevan/copromem"
Repository = "https://github.com/tuananhlevan/copromem"
Issues = "https://github.com/tuananhlevan/copromem/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
copromem = "copromem.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
